services:
  # ============================================================
  # PostgreSQL 数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: public-info-sync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-public_info_sync}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-public_info_sync}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # ============================================================
  # 政策监测系统应用
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL
        - ADMIN_TOKEN
        - LLM_API_KEY
        - LLM_BASE_URL
        - LLM_MODEL
        - LLM_TEMPERATURE
        - LLM_MAX_TOKENS
    container_name: public-info-sync-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # 数据库连接
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/public_info_sync}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}

      # 管理令牌（写操作鉴权）
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-please}

      # LLM 配置（可选）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}

      # Node.js 配置
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Asia/Shanghai}

      # Next.js 配置
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/monitor/status', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
